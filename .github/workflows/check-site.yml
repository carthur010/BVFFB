name: Check the site

# Runs the same safety check on every push, so a broken page shows up as a red X on the commit.
on:
  push:
    branches: [main]
    paths: ["index.html", "data/**", "scripts/smoke.js"]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-save --silent jsdom@24
      - run: node scripts/smoke.js
