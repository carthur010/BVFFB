<style>
/* Layout idea: a league record book. Red banner header, tabbed sections, dense sortable tables, banners in the rafters for titles. */
:root{
  --bg:#f3f4f7; --surface:#ffffff; --ink:#141a2b; --muted:#5d6577; --line:#dfe2ea;
  --accent:#c8102e; --accent-ink:#ffffff; --navy:#16213e; --gold:#b8860b;
  --good:#1f8a4c; --bad:#c23b3b; --good-bg:#e3f4ea; --bad-bg:#fbe7e7; --soft:#eef0f5;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1220; --surface:#161c2e; --ink:#e9ecf4; --muted:#9aa3b8; --line:#273049;
    --accent:#e2384f; --accent-ink:#ffffff; --navy:#0a0f1d; --gold:#e0b44a;
    --good:#4cc683; --bad:#ef6b6b; --good-bg:#16352a; --bad-bg:#3a1c22; --soft:#1d2539;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1220; --surface:#161c2e; --ink:#e9ecf4; --muted:#9aa3b8; --line:#273049;
  --accent:#e2384f; --accent-ink:#ffffff; --navy:#0a0f1d; --gold:#e0b44a;
  --good:#4cc683; --bad:#ef6b6b; --good-bg:#16352a; --bad-bg:#3a1c22; --soft:#1d2539;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:.01em}
h2{font-size:28px;font-weight:700;text-transform:uppercase}
h3{font-size:19px;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
a{color:inherit}
button,select{font-family:inherit;font-size:14px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

header.top{background:var(--navy);color:#fff;border-bottom:4px solid var(--accent)}
.top-inner{max-width:1240px;margin:0 auto;padding:18px 20px 0;display:flex;flex-direction:column;gap:14px}
.brand{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand h1{font-size:40px;font-weight:800;line-height:1;text-transform:uppercase}
.brand h1 span{color:var(--accent)}
.brand p{margin:4px 0 0;color:#b8c0d4;font-size:14px}
.brand .asof{font-size:13px;color:#b8c0d4;text-align:right}
nav.tabs{display:flex;gap:4px;overflow-x:auto}
nav.tabs a{font-family:var(--display);text-transform:uppercase;font-weight:700;font-size:17px;letter-spacing:.04em;text-decoration:none;color:#c7cde0;padding:10px 14px;border-radius:6px 6px 0 0;white-space:nowrap}
nav.tabs a:hover{color:#fff;background:rgba(255,255,255,.06)}
nav.tabs a.on{background:var(--accent);color:#fff}

main{max-width:1240px;margin:0 auto;padding:22px 20px 60px;display:flex;flex-direction:column;gap:22px}
.subtabs{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);text-decoration:none;font-weight:600;font-size:14px;cursor:pointer;color:var(--ink)}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px}
.card > h3{margin-bottom:12px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.lede{color:var(--muted);margin:4px 0 0;max-width:70ch}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:18px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}

.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-family:var(--display);text-transform:uppercase;font-size:14px;letter-spacing:.04em;color:var(--muted);font-weight:700;background:var(--soft);position:sticky;top:0}
th.s{cursor:pointer;user-select:none}
th.s:hover{color:var(--ink)}
th.sorted{color:var(--accent)}
td.r,th.r{text-align:right}
tbody tr:hover{background:var(--soft)}
.mgr{font-weight:600;text-decoration:none;border-bottom:1px dotted var(--muted)}
.mgr:hover{color:var(--accent);border-color:var(--accent)}
.sub{color:var(--muted);font-size:12.5px}
.pill{display:inline-block;padding:2px 8px;border-radius:4px;font-size:12px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;white-space:nowrap}
.p-champ{background:var(--gold);color:#fff}
.p-ru{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.p-po{background:var(--good-bg);color:var(--good)}
.p-miss{background:transparent;color:var(--muted)}
.p-last{background:var(--bad-bg);color:var(--bad)}
.p-live{background:var(--accent);color:#fff}
.pos{color:var(--good)} .neg{color:var(--bad)}

/* rafters */
.rafters{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}
.rafters-wrap{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px 10px;overflow:visible}
@media (max-width:600px){.rafters-wrap{grid-template-columns:repeat(3,minmax(0,1fr))}}
.rafters-wrap .banner{flex:none;width:auto}
.banner{flex:0 0 140px;background:var(--navy);color:#fff;padding:14px 10px 26px;text-align:center;clip-path:polygon(0 0,100% 0,100% 100%,50% 88%,0 100%);border-top:4px solid var(--accent);text-decoration:none;display:flex;flex-direction:column;gap:4px}
.banner .yr{font-family:var(--display);font-size:30px;font-weight:800;color:var(--gold);line-height:1}
.banner .who{font-family:var(--display);font-weight:700;font-size:17px;text-transform:uppercase;line-height:1.05}
.banner .tm{font-size:12px;color:#b8c0d4;line-height:1.2}
.banner:hover{border-top-color:var(--gold)}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.tile{background:var(--soft);border-radius:8px;padding:12px}
.tile .v{font-family:var(--display);font-size:28px;font-weight:700;line-height:1.05}
.tile .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}

.rec-list{display:flex;flex-direction:column}
.rec-row{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--line)}
.rec-row:last-child{border-bottom:0}
.rec-row .rk{font-family:var(--display);font-weight:700;color:var(--muted)}
.rec-row:first-child .rk{color:var(--accent)}
.rec-row .val{font-family:var(--display);font-weight:700;font-size:19px;font-variant-numeric:tabular-nums}
.rec-row:first-child .val{color:var(--accent)}

.badges{display:flex;flex-wrap:wrap;gap:6px}
.badge{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:13px;font-weight:600;background:var(--surface)}
.badge i{font-style:normal;display:inline-grid;place-items:center;width:20px;height:20px;border-radius:4px;font-size:11px;font-weight:800;color:#fff;background:var(--good)}
.badge.f i{background:var(--bad)}
.badge.t i{background:var(--gold)}
.badge b{font-variant-numeric:tabular-nums;color:var(--muted)}

.h2h td{text-align:center;padding:6px 4px;font-size:13px;min-width:54px}
.h2h td.cell{cursor:pointer}
.h2h td.cell:hover{outline:2px solid var(--accent);outline-offset:-2px}
.h2h th.rowh{text-align:left;position:sticky;left:0;z-index:1}
.h2h th.colh{writing-mode:vertical-rl;transform:rotate(180deg);height:120px;text-align:left;padding:8px 4px}

.vs-head{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:center;text-align:center}
.vs-head .big{font-family:var(--display);font-size:64px;font-weight:800;line-height:1}
.vs-head .nm{font-family:var(--display);font-size:24px;font-weight:700;text-transform:uppercase}
.ctrl{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ctrl label{font-size:13px;color:var(--muted);font-weight:600}
select{padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
.toggle{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;cursor:pointer}

.wkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.wk{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface)}
.wk h4{margin:0 0 6px;font-family:var(--display);text-transform:uppercase;font-size:15px;color:var(--muted)}
.gm{display:grid;grid-template-columns:1fr auto;gap:2px 8px;font-size:13px;padding:4px 0;border-top:1px solid var(--line)}
.gm:first-of-type{border-top:0}
.gm .w{font-weight:700}
.gm .l{color:var(--muted)}

.bracket{display:flex;gap:16px;overflow-x:auto}
.round{flex:1 0 220px;display:flex;flex-direction:column;gap:10px;justify-content:space-around}
.round h4{margin:0;font-family:var(--display);text-transform:uppercase;color:var(--accent);font-size:16px}
.match{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.match div{display:flex;justify-content:space-between;gap:8px;padding:7px 10px;font-size:14px}
.match div + div{border-top:1px solid var(--line)}
.match .w{font-weight:700;background:var(--good-bg)}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;background:var(--c)}
.story{font-size:13px;color:var(--muted);white-space:normal;min-width:260px}
.note{font-size:13px;color:var(--muted)}
.hero{display:grid;grid-template-columns:1fr;gap:28px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:22px}
.big-banner{flex:none;width:190px;padding:18px 14px 40px;gap:6px}
.big-banner .yr{font-size:48px}
.big-banner .who{font-size:22px}
.hero-copy{display:flex;flex-direction:column;gap:10px}
.hero-copy h2{font-size:36px}
.strip{display:flex;flex-wrap:wrap;gap:10px 28px;margin-top:6px;padding-top:12px;border-top:1px solid var(--line)}
.strip .v{font-family:var(--display);font-size:26px;font-weight:700;line-height:1}
.strip .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.explore{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.explore a{display:flex;flex-direction:column;gap:2px;padding:14px 16px;border-radius:8px;background:var(--navy);color:#fff;text-decoration:none;border-left:4px solid var(--accent)}
.explore a b{font-family:var(--display);text-transform:uppercase;font-size:18px;letter-spacing:.03em}
.explore a span{font-size:13px;color:#b8c0d4}
.explore a:hover{border-left-color:var(--gold)}
@media (max-width:700px){.hero{grid-template-columns:1fr;justify-items:center}.hero-copy h2{font-size:28px}}
.riv-wrap{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px}
.riv-side{display:flex;flex-direction:column;gap:8px}
.riv{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:8px;background:var(--soft);text-decoration:none;color:var(--ink);border-left:3px solid var(--accent)}
a.riv:hover{border-left-color:var(--gold)}
.riv .k{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.riv b{font-family:var(--display);font-size:18px;font-weight:700}
.riv-gow{background:var(--navy);color:#fff;border-left-color:var(--gold)}
.riv-gow .k,.riv-gow .sub{color:#b8c0d4}
.mtgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px}
.mtg{display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 4px;border-radius:6px;background:var(--soft);text-decoration:none;color:var(--ink);font-size:12px;border-top:3px solid var(--line)}
.mtg b{font-family:var(--display);font-size:15px}
.mtg-a{border-top-color:var(--accent)}
.mtg-b{border-top-color:var(--navy)}
@media (max-width:800px){.riv-wrap{grid-template-columns:1fr}}
.banner .bdet{font-size:11px;color:#8f98b0;line-height:1.2;font-variant-numeric:tabular-nums}
.banner .bdet:first-of-type{margin-top:2px}
.wire{display:flex;flex-direction:column}
.wire-item{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.wire-item:last-child{border-bottom:0}
.wtag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:2px 6px;border-radius:4px;text-align:center}
.w-rec{background:var(--accent);color:#fff}.w-bad{background:var(--bad-bg);color:var(--bad)}.w-good{background:var(--good-bg);color:var(--good)}.w-gold{background:var(--gold);color:#fff}.w-neu{background:var(--soft);color:var(--ink)}
.ms-row{padding:8px 0;border-bottom:1px solid var(--line)}
.ms-row:last-child{border-bottom:0}
.bar{height:6px;border-radius:3px;background:var(--soft);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);border-radius:3px}
.mu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.mu{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:start;border:1px solid var(--line);border-radius:8px;padding:12px}
.mu-side{display:flex;flex-direction:column;gap:4px}
.mu-side:last-of-type{text-align:right}
.mu-vs{font-family:var(--display);color:var(--muted);font-weight:700;padding-top:4px}
.mu-p{font-family:var(--display);font-size:26px;font-weight:700;color:var(--muted)}
.mu-p.fav{color:var(--accent)}
.mu-foot{grid-column:1/-1;border-top:1px solid var(--line);padding-top:8px;font-size:13px}
.heat{font-size:12px}
.heat th,.heat td{padding:4px 3px;text-align:center;min-width:30px}
.heat th a{text-decoration:none;color:inherit}
.heat td.hm a{display:block;text-decoration:none;color:inherit;font-weight:700;font-variant-numeric:tabular-nums}
.heat td.hm{border:2px solid var(--surface);border-radius:4px}
.hm-1{background:var(--gold);color:#fff}
.hm-2{background:#9aa3b8;color:#fff}
.hm-po{background:var(--good-bg);color:var(--good)}
.hm-miss{background:var(--soft);color:var(--muted)}
.hm-last{background:var(--bad-bg);color:var(--bad)}
.hm-live{background:transparent;color:var(--muted);border:1px dashed var(--line)!important}
.hm-empty{background:transparent}
td.pin,th.pin{position:sticky;left:0;z-index:1;background:var(--surface);box-shadow:1px 0 0 var(--line)}
th.pin{z-index:2;background:var(--soft)}
tbody tr:hover td.pin{background:var(--soft)}
button.badge{cursor:pointer;font-family:inherit;color:var(--ink)}
button.badge:hover,button.badge.on{border-color:var(--accent)}
button.badge.on{background:var(--soft)}
.bdetail{margin-top:10px;padding:12px 14px;border-radius:8px;background:var(--soft);font-size:13.5px}
.bdetail b{font-family:var(--display);text-transform:uppercase;font-size:16px;letter-spacing:.03em}
.bdetail ul{margin:6px 0 0;padding-left:18px;columns:2 220px;column-gap:24px}
.bdetail li{margin:2px 0;break-inside:avoid}
.more-toggle{display:flex;justify-content:flex-end;margin-bottom:8px}
@media (max-width:600px){
  nav.tabs{flex-wrap:wrap;gap:4px;padding-bottom:8px;overflow:visible}
  nav.tabs a{font-size:14px;padding:6px 10px;border-radius:6px}
  .top-inner{gap:10px}
  .brand h1{font-size:30px}
  .vs-head .big{font-size:42px}
  .vs-head .nm{font-size:18px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<header class="top">
  <div class="top-inner">
    <div class="brand">
      <div>
        <h1><a href="#home" style="text-decoration:none;color:inherit">BVFFB</a></h1>
        <p>Bella Vista Fantasy Football · Est. 2011</p>
      </div>
    </div>
    <nav class="tabs" id="tabs">
      <a href="#home" data-g="home">Home</a>
      <a href="#now" data-g="now" id="tab-now">This Season</a>
      <a href="#standings" data-g="history">League History</a>
      <a href="#records" data-g="records">Record Book</a>
      <a href="#franchise" data-g="franchise">Franchises</a>
      <a href="#h2h" data-g="h2h">Head-to-Head</a>
      <a href="#achievements" data-g="achievements">Achievements</a>
    </nav>
  </div>
</header>
<main id="app"></main>

<script>
window.BOOT = function(DATA){
"use strict";
// ---------- league corrections ESPN can't express ----------
// 2012: ESPN ran all 17 weeks as regular season. The league treated Weeks 1-13 as the regular season and
// Weeks 14-17 as a 4-team playoff of two-week matchups (14+15, 16+17). Final placements follow ESPN's trophies.
(function fix2012(){
  const s=DATA.S&&DATA.S['2012']; if(!s||s.fixed) return;
  const games=s.G.split(';').map(x=>{const p=x.split(',');return {wk:+p[0],h:+p[1],hs:+p[2],a:+p[3],as:+p[4]};});
  const reg=games.filter(g=>g.wk<=13), rec={};
  s.T.forEach(t=>rec[t[0]]={w:0,l:0,t:0,pf:0,pa:0});
  reg.forEach(g=>{const H=rec[g.h],A=rec[g.a]; H.pf+=g.hs;H.pa+=g.as;A.pf+=g.as;A.pa+=g.hs; if(g.hs>g.as){H.w++;A.l++;}else if(g.as>g.hs){A.w++;H.l++;}else{H.t++;A.t++;}});
  const order=s.T.map(t=>t[0]).sort((a,b)=>(rec[b].w-rec[a].w)||(rec[b].pf-rec[a].pf));
  s.T.forEach(t=>{const r=rec[t[0]]; t[4]=order.indexOf(t[0])+1; t[5]=r.w;t[6]=r.l;t[7]=r.t;t[8]=Math.round(r.pf*100)/100;t[9]=Math.round(r.pa*100)/100;});
  const field=new Set(order.slice(0,4)), po=[];
  [[14,15],[16,17]].forEach(([w1,w2])=>{
    games.filter(g=>g.wk===w1&&field.has(g.h)&&field.has(g.a)).forEach(g=>{
      const g2=games.find(x=>x.wk===w2&&((x.h===g.h&&x.a===g.a)||(x.h===g.a&&x.a===g.h))); if(!g2) return;
      const hs=g.hs+(g2.h===g.h?g2.hs:g2.as), as=g.as+(g2.h===g.h?g2.as:g2.hs);
      po.push([w1,g.h,hs,g.a,as,'P'].join(','));});
  });
  s.G=reg.map(g=>[g.wk,g.h,g.hs,g.a,g.as,'R'].join(',')).concat(po).join(';');
  s.reg=13; s.po=4; s.fixed=true;
})();
// ---------- helpers ----------

  const allY=series.flatMap(s=>s.pts.filter(p=>p[1]!=null).map(p=>p[1]));
  let lo=yMin!=null?yMin:Math.min(...allY), hi=yMax!=null?yMax:Math.max(...allY);
  if(yMin==null){const pad=(hi-lo)*.1||1; lo-=pad; hi+=pad;}
  const xi=x=>L+(xs.length===1?iw/2:xs.indexOf(x)*iw/(xs.length-1));
  const yv=v=>invert? T+(v-lo)/(hi-lo)*ih : T+ih-(v-lo)/(hi-lo)*ih;
  if(!yTicks&&yMin==null){const st=(hi-lo)/4>8?10:5; lo=Math.floor(lo/st)*st; hi=Math.ceil(hi/st)*st;}
  const ticks = yTicks || (()=>{const st=(hi-lo)/4>8?10:((hi-lo)/4>3?5:(hi-lo)/4); const out=[]; for(let v=lo; v<=hi+1e-9; v+=st) out.push(v); return out.length>7?out.filter((_,k)=>k%2===0):out;})();
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img">`;
  ticks.forEach(t=>{s+=`<line x1="${L}" x2="${W-R}" y1="${yv(t)}" y2="${yv(t)}" stroke="var(--line)"/><text x="${L-6}" y="${yv(t)+4}" font-size="11" text-anchor="end" fill="var(--muted)">${yFmt?yFmt(t):Math.round(t)}</text>`;});
  (marks||[]).forEach((m,mi)=>{ if(xs.indexOf(m.x)<0) return; const x=xi(m.x); s+=`<line x1="${x}" x2="${x}" y1="${T}" y2="${T+ih}" stroke="var(--muted)" stroke-dasharray="2 3"/><text x="${x+4}" y="${T+10+mi*13}" font-size="10" fill="var(--muted)">${esc(m.label)}</text>`; });
  const step=Math.ceil(xs.length/12);
  xs.forEach((x,k)=>{ if(k%step===0||k===xs.length-1) s+=`<text x="${xi(x)}" y="${H-8}" font-size="11" text-anchor="middle" fill="var(--muted)">${/^\d{4}$/.test(String(x))?"'"+String(x).slice(2):x}</text>`; });
  series.forEach(se=>{
    const pts=se.pts.filter(p=>p[1]!=null);
    if(se.area&&pts.length>1){ s+=`<path d="M${xi(pts[0][0])},${T+ih} ${pts.map(p=>`L${xi(p[0])},${yv(p[1])}`).join(' ')} L${xi(pts[pts.length-1][0])},${T+ih} Z" fill="${se.color}" opacity=".12"/>`; }
    // break line on gaps
    let d='', prevIdx=null;
    se.pts.forEach(p=>{ if(p[1]==null){prevIdx=null;return;} const k=xs.indexOf(p[0]); d+=(prevIdx!=null&&k===prevIdx+1?'L':'M')+xi(p[0])+','+yv(p[1])+' '; prevIdx=k; });
    s+=`<path d="${d}" fill="none" stroke="${se.color}" stroke-width="${se.w||2.5}" stroke-linejoin="round" ${se.dash?'stroke-dasharray="5 4"':''}/>`;
    pts.forEach((p,k)=>{ const end=k===pts.length-1; s+=`<circle cx="${xi(p[0])}" cy="${yv(p[1])}" r="${end?4.5:3}" fill="${end?se.color:'var(--surface)'}" stroke="${se.color}" stroke-width="2"><title>${esc(se.name)} ${p[0]}: ${yFmt?yFmt(p[1]):p[1]}${p[2]?' · '+esc(p[2]):''}</title></circle>`; });
  });
  return `<div class="chart">${s}</svg></div>`;
}
function barChart({items, h=240, yFmt, color='var(--accent)', hl, ref, low, max}){
  const W=760,H=h,L=46,R=10,T=14,B=30, iw=W-L-R, ih=H-T-B;
  const hi=max||Math.max(...items.map(i=>Math.max(i.v,i.ref||0)))*1.1, bw=iw/items.length;
  const y=v=>T+ih-v/hi*ih;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img">`;
  for(let k=0;k<=4;k++){const t=hi*k/4; s+=`<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="${L-6}" y="${y(t)+4}" font-size="11" text-anchor="end" fill="var(--muted)">${yFmt?yFmt(t):Math.round(t)}</text>`;}
  items.forEach((it,k)=>{const x=L+k*bw+bw*.15; s+=`<rect x="${x}" y="${y(it.v)}" width="${bw*.7}" height="${T+ih-y(it.v)}" rx="2" fill="${hl&&hl(it)?'var(--gold)':(low&&low(it)?'var(--muted)':color)}" ${low&&low(it)?'opacity=".55"':''}><title>${esc(it.label)}: ${yFmt?yFmt(it.v):it.v}</title></rect><text x="${x+bw*.35}" y="${H-8}" font-size="11" text-anchor="middle" fill="var(--muted)">${esc(it.x)}</text>`;});
  if(items.some(i=>i.ref!=null)){ const d=items.map((it,k)=>`${k?'L':'M'}${L+k*bw+bw*.1},${y(it.ref)} L${L+k*bw+bw*.9},${y(it.ref)}`).join(' ');
    s+=`<path d="${d}" fill="none" stroke="var(--ink)" stroke-width="2" stroke-dasharray="4 3"/>`; }
  return `<div class="chart">${s}</svg></div>`;
}

function vTrends(){
  const xs=YEARS, live=!curS.complete;
  const regOf=y=>SEASONS[y].games.filter(g=>!g.po);
  const scoresOf=y=>regOf(y).flatMap(g=>[g.hs,g.as]);
  const median=a=>{const s=a.slice().sort((x,y)=>x-y),n=s.length;return n?(n%2?s[(n-1)/2]:(s[n/2-1]+s[n/2])/2):NaN;};
  // scoring
  const avgS=xs.map(y=>[y,avg(scoresOf(y))]);
  const medS=xs.map(y=>[y,median(scoresOf(y))]);
  const hiS=xs.map(y=>[y,Math.max(...SEASONS[y].games.filter(g=>!g.multi).flatMap(g=>[g.hs,g.as]))]);
  const loS=xs.map(y=>[y,Math.min(...SEASONS[y].games.filter(g=>!g.multi).flatMap(g=>[g.hs,g.as]))]);
  // eras
  const ERA=[[2011,2013,'Early days','var(--muted)'],[2014,2018,'Decimal era','var(--gold)'],[2019,2022,'Expansion years','var(--ink)'],[2023,CUR,'Modern era','var(--accent)']];
  const eraYears=e=>YEARS.filter(y=>y>=e[0]&&y<=e[1]);
  // distribution
  const bins=[]; for(let b=40;b<=170;b+=10) bins.push(b);
  const binLbl=b=>b===40?'<50':b===170?'170+':String(b);
  const dist=ERA.map(e=>{const sc=eraYears(e).flatMap(scoresOf); return {e,pts:bins.map(b=>[binLbl(b), sc.filter(s=>b===40?s<50:b===170?s>=170:(s>=b&&s<b+10)).length/sc.length*100])};});
  // scoring by week of season
  const weeksN=14, wkx=Array.from({length:weeksN},(_,k)=>k+1);
  const wkLine=(ys)=>wkx.map(w=>{const sc=ys.flatMap(y=>regOf(y).filter(g=>g.wk===w).flatMap(g=>[g.hs,g.as]));return [w,sc.length?avg(sc):null];});
  const early=YEARS.filter(y=>y<=2018), modern=YEARS.filter(y=>y>=2019);
  // parity + concentration
  const done=xs.filter(y=>SEASONS[y].complete);
  const parity=done.map(y=>({x:"'"+String(y).slice(2),label:String(y),v:sd(SEASONS[y].list.map(t=>t.wp))}));
  const seen=new Set(); const conc=done.map(y=>{seen.add(SEASONS[y].champ.m); return [y,seen.size];});
  // closeness
  const marg=xs.map(y=>[y,avg(regOf(y).map(g=>g.margin))]);
  const close=xs.map(y=>{const r=regOf(y);return [y,r.filter(g=>g.margin<10).length/r.length*100];});
  const blow=xs.map(y=>{const r=regOf(y);return [y,r.filter(g=>g.margin>=50).length/r.length*100];});
  // playoffs: chalk rate and scoring
  const poYears=done.filter(y=>SEASONS[y].po>0);
  const chalk=poYears.map(y=>{const P=SEASONS[y].games.filter(g=>g.po&&!g.tie&&g.ht.seed!==g.at.seed); const fav=P.filter(g=>Math.min(g.ht.seed,g.at.seed)===g.wt.seed).length; return {x:"'"+String(y).slice(2),label:`${y}: favorites won ${fav} of ${P.length}`,v:P.length?fav/P.length*100:0};});
  const chalkAll=(()=>{const P=poYears.flatMap(y=>SEASONS[y].games.filter(g=>g.po&&!g.tie&&g.ht.seed!==g.at.seed)); return P.filter(g=>Math.min(g.ht.seed,g.at.seed)===g.wt.seed).length/P.length*100;})();

  <div class="card"><h3>Scoring by Season</h3>${legend([['var(--gold)','Season high'],['var(--accent)','Average'],['var(--ink)','Median'],['var(--muted)','Season low']])}

  <div class="grid2">
    <div class="card"><h3>Score Distribution by Era</h3>${legend(ERA.map(e=>[e[3],`${e[2]} (${e[0]}–${e[1]===CUR?'now':String(e[1]).slice(2)})`]))}

}

// ----- Record book -----
const ERAS=[['all','All-time'],['2011-2013','2011–2013'],['2014-2018','2014–2018'],['2019-2022','2019–2022'],['2023-2099','2023–now']];
let REC_F={type:'all',era:'all',active:false,n:5};
// running records entering each regular season game
YEARS.forEach(y=>{const run={}; SEASONS[y].games.filter(g=>!g.po).sort((a,b)=>a.wk-b.wk).forEach(g=>{
  [g.ht,g.at].forEach(t=>{run[t.id]=run[t.id]||{w:0,l:0,t:0};});
  g.hRec={...run[g.ht.id]}; g.aRec={...run[g.at.id]};
  if(g.hs>g.as){run[g.ht.id].w++;run[g.at.id].l++;} else if(g.as>g.hs){run[g.at.id].w++;run[g.ht.id].l++;} else {run[g.ht.id].t++;run[g.at.id].t++;}
});});
// weekly averages
Object.values(weekly).forEach(arr=>{const a=avg(arr.map(e=>e.s)); arr.forEach(e=>{e.wavg=a; e.diff=e.s-a;});});
// season-level extras per team
YEARS.forEach(y=>SEASONS[y].list.forEach(t=>{
  const gs=SEASONS[y].games.filter(g=>!g.po&&(g.ht===t||g.at===t)).sort((a,b)=>a.wk-b.wk);
  const sc=gs.map(g=>g.ht===t?g.hs:g.as), res=gs.map(g=>{const m=g.ht===t?g.hs:g.as,o=g.ht===t?g.as:g.hs;return m>o?'W':m<o?'L':'T';});
  let k=0; while(k<res.length&&res[k]==='W')k++; t.startW=k; k=0; while(k<res.length&&res[k]==='L')k++; t.startL=k;
  t.cv = sc.length>2? sd(sc)/avg(sc)*100 : NaN;
  t.diffpg = t.games? (t.pf-t.pa)/t.games : NaN;
  const pg=SEASONS[y].games.filter(g=>g.po&&(g.ht===t||g.at===t)).sort((a,b)=>a.wk-b.wk);
  t.poPts = pg.length&&!SEASONS[y].twoWk ? sum(pg.map(g=>g.ht===t?g.hs:g.as)) : null; t.poGames=pg.length;
  t.firstExit = pg.length>0 && (pg[0].lose===t.m);
}));

function recList(title, items, fmt, sub){
  const rows=items.slice(0,REC_F.n);
  return `<div class="card"><h3>${title}</h3>${sub?`<p class="note" style="margin:-6px 0 8px">${sub}</p>`:''}<div class="rec-list">${rows.length?rows.map((it,k)=>`<div class="rec-row"><span class="rk">${k+1}</span><span>${it.who}<div class="sub">${it.det}</div></span><span class="val">${fmt(it.v)}</span></div>`).join(''):'<p class="note">Nothing matches these filters.</p>'}</div></div>`;
}
function gd(g){return `${g.y} Wk ${g.wk}${g.po?' · playoffs':''}`;}
function vRecords(sec){

    <label for="rf-era">Era</label><select id="rf-era">${ERAS.map(([v,l])=>`<option value="${v}" ${REC_F.era===v?'selected':''}>${l}</option>`).join('')}</select>`}
    <label class="toggle"><input type="checkbox" id="rf-active" ${REC_F.active?'checked':''}> Active managers only</label>
    <label for="rf-n">Show</label><select id="rf-n"><option value="5" ${REC_F.n===5?'selected':''}>Top 5</option><option value="10" ${REC_F.n===10?'selected':''}>Top 10</option></select>
    ${careerSec?'<span class="note">Career records cover every season, so the game and era filters don\'t apply here.</span>':''}

    ${recList('Biggest Collapse',turn.slice().sort((a,b)=>a.v-b.v).map(x=>({v:x.v,who:mlink(x.t.m),det:`${rec(x.p.w,x.p.l,x.p.t)} in ${x.p.y} to ${rec(x.t.w,x.t.l,x.t.t)} in ${x.t.y}`})),v=>sgn(v,0)+' pts')}
    ${recList('Most Consistent',TS.filter(t=>!isNaN(t.cv)).sort((a,b)=>a.cv-b.cv).map(t=>({v:t.cv,who:tw(t),det:td(t)+` · ${f1(t.ppg)} per game`})),v=>f1(v)+'%','Lowest week-to-week swing (coefficient of variation)')}
    ${recList('Most Boom or Bust',TS.filter(t=>!isNaN(t.cv)).sort((a,b)=>b.cv-a.cv).map(t=>({v:t.cv,who:tw(t),det:td(t)+` · ${f1(t.ppg)} per game`})),v=>f1(v)+'%')}
    ${recList('Luckiest Season',TS.slice().sort((a,b)=>b.luck-a.luck).map(t=>({v:t.luck,who:tw(t),det:td(t)+` · all-play ${pct(t.apPct)}`})),v=>sgn(v)+' W')}
    ${recList('Unluckiest Season',TS.slice().sort((a,b)=>a.luck-b.luck).map(t=>({v:t.luck,who:tw(t),det:td(t)+` · all-play ${pct(t.apPct)}`})),v=>sgn(v)+' W')}
    </div>`;
  } else if(sec==='playoffs'){
    const PY=DONE.filter(y=>inEra(y)&&SEASONS[y].po>0);
    const P=GAMES.filter(g=>g.po&&inEra(g.y));
    const PS=P.filter(g=>!g.multi).flatMap(g=>[{m:g.h,t:g.ht,s:g.hs,op:g.a,g},{m:g.a,t:g.at,s:g.as,op:g.h,g}]).filter(x=>okM(x.m));
    const finals=PY.map(y=>SEASONS[y].final).filter(g=>g&&okM(g.win));
    const PT=PY.flatMap(y=>SEASONS[y].list).filter(t=>okM(t.m));
    const tally=k=>{const o={}; PT.forEach(t=>{if(k(t)){(o[t.m]=o[t.m]||[]).push(t.y);}}); return Object.entries(o).map(([m,ys])=>({m:+m,ys})).sort((a,b)=>b.ys.length-a.ys.length);};
    const pw={}; P.forEach(g=>{[[g.h,g.hs>g.as],[g.a,g.as>g.hs]].forEach(([m,w])=>{if(!okM(m))return; pw[m]=pw[m]||{w:0,l:0}; w?pw[m].w++:pw[m].l++;});});
    const pwl=Object.entries(pw).map(([m,r])=>({m:+m,...r,p:r.w/(r.w+r.l)}));
    const ups=P.filter(g=>!g.tie&&g.wt.seed>g.lt.seed&&okM(g.win)).sort((a,b)=>(b.wt.seed-b.lt.seed)-(a.wt.seed-a.lt.seed)||b.y-a.y);
    const seedRows=[1,2,3,4,5,6].map(s=>{const ts=PY.flatMap(y=>SEASONS[y].list.filter(t=>t.seed===s&&t.made)); const gs=P.filter(g=>g.ht.seed===s||g.at.seed===s); let w=0,l=0; gs.forEach(g=>{if(g.ht.seed===s){g.hs>g.as?w++:l++;} if(g.at.seed===s){g.as>g.hs?w++:l++;}}); return {s,n:ts.length,t:ts.filter(t=>t.f===1).length,f:ts.filter(t=>t.f<=2).length,w,l};}).filter(r=>r.n);
    body=`<div class="grid3">
    ${recList('Most Championships',tally(t=>t.f===1).map(x=>({v:x.ys.length,who:mlink(x.m),det:x.ys.join(', ')})),v=>v)}
    ${recList('Most Title Game Trips',tally(t=>t.f<=2).map(x=>({v:x.ys.length,who:mlink(x.m),det:x.ys.join(', ')})),v=>v)}
    ${recList('Most Playoff Trips',tally(t=>t.made).map(x=>({v:x.ys.length,who:mlink(x.m),det:`${x.ys[0]}–${x.ys[x.ys.length-1]}`})),v=>v)}
    ${recList('Best Playoff Win %',pwl.filter(r=>r.w+r.l>=4).sort((a,b)=>b.p-a.p||b.w-a.w).map(r=>({v:r.p,who:mlink(r.m),det:`${r.w}-${r.l} in playoff games`})),pct,'Minimum 4 playoff games')}
    ${recList('Most Playoff Losses',pwl.slice().sort((a,b)=>b.l-a.l).map(r=>({v:r.l,who:mlink(r.m),det:`${r.w}-${r.l} in playoff games`})),v=>v)}
    ${recList('Most First-Round Exits',tally(t=>t.made&&t.firstExit).map(x=>({v:x.ys.length,who:mlink(x.m),det:x.ys.join(', ')})),v=>v,'Lost the first playoff game they played')}
    ${recList('Highest Playoff Score',PS.sort((a,b)=>b.s-a.s).map(x=>({v:x.s,who:mlink(x.m),det:`${esc(x.t.n)} vs ${esc(M[x.op].short)} · ${x.g.y} Wk ${x.g.wk}`})),f2,'Single-week playoff games')}
    ${recList('Most Points in a Playoff Run',PT.filter(t=>t.poPts!=null).sort((a,b)=>b.poPts-a.poPts).map(t=>({v:t.poPts,who:mlink(t.m),det:`${esc(t.n)} · ${t.y} · ${t.poGames} games · finished ${ord(t.f)}`})),f2,'Seasons with single-week playoff games')}
    ${recList('Biggest Playoff Upset',ups.map(g=>({v:g.wt.seed-g.lt.seed,who:mlink(g.win),det:`${g.wt.seed} seed over ${g.lt.seed} seed ${esc(M[g.lose].short)}, ${f2(g.ws)}-${f2(g.ls)} · ${g.y} Wk ${g.wk}`})),v=>v+' seeds')}
    ${recList('Biggest Title Game Win',finals.slice().sort((a,b)=>b.margin-a.margin).map(g=>({v:g.margin,who:mlink(g.win),det:`${f2(g.ws)}-${f2(g.ls)} over ${esc(M[g.lose].short)} · ${g.y}${g.multi?' · two-week final':''}`})),f2)}
    ${recList('Closest Title Game',finals.slice().sort((a,b)=>a.margin-b.margin).map(g=>({v:g.margin,who:mlink(g.win),det:`${f2(g.ws)}-${f2(g.ls)} over ${esc(M[g.lose].short)} · ${g.y}${g.multi?' · two-week final':''}`})),f2)}
    ${recList('Most #1 Seeds',tally(t=>t.seed===1).map(x=>({v:x.ys.length,who:mlink(x.m),det:x.ys.join(', ')})),v=>v)}
    </div>
    <div class="card"><h3>Playoff Record by Seed</h3><p class="note" style="margin:-6px 0 8px">How each seed has fared${REC_F.era==='all'?' since the playoff era began':' in this era'}. Byes count as an appearance, not a win.</p>
    ${table('t-seed',[{k:'s',label:'Seed',r:1,asc:1},{k:'n',label:'Appearances',r:1},{k:'t',label:'Titles',r:1,f:r=>`<b>${r.t}</b>`},{k:'f',label:'Title Games',r:1},{k:'tp',label:'Title %',r:1,f:r=>pct(r.t/r.n),sv:r=>r.t/r.n},{k:'wl',label:'Playoff W-L',r:1,f:r=>rec(r.w,r.l),sv:r=>r.w/(r.w+r.l||1)}],seedRows,'s','asc')}</div>`;
  } else if(sec==='streaks'){
    const CC=C.filter(c=>okM(c.i));
    const sDet=s=>s.from?`${s.from.y} Wk ${s.from.wk} to ${s.to.y} Wk ${s.to.wk}`:'–';
    const run=(arr,ok)=>{let best={n:0},cur=null; arr.forEach(x=>{ if(ok(x)){cur=cur?{...cur,n:cur.n+1,to:x}:{n:1,from:x,to:x}; if(cur.n>best.n)best={...cur};} else cur=null;}); return best;};
    const s100=CC.map(c=>({c,s:run(c.games.filter(x=>!x.g.multi),x=>x.ms>=100)}));
    const seasonRun=(c,ok)=>{let best={n:0},cur=null,prev=null; c.teams.filter(t=>SEASONS[t.y].complete).forEach(t=>{ if(prev!=null&&t.y!==prev+1)cur=null; if(ok(t)){cur=cur?{...cur,n:cur.n+1,to:t.y}:{n:1,from:t.y,to:t.y}; if(cur.n>best.n)best={...cur};} else cur=null; prev=t.y;}); return best;};
    const vsRun=[]; CC.forEach(c=>Object.entries(c.h2h).forEach(([o,h])=>{const s=run(h.list,x=>x.r==='W'); if(s.n)vsRun.push({c,o:+o,s});}));
    const active=CC.filter(c=>c.active);
    body=`<p class="note">Game streaks include playoffs and carry across seasons.</p><div class="grid3">
    ${recList('Longest Win Streak',CC.slice().sort((a,b)=>b.winStreak.n-a.winStreak.n).map(c=>({v:c.winStreak.n,who:mlink(c.i),det:sDet(c.winStreak)})),v=>v+' W')}
    ${recList('Longest Losing Streak',CC.slice().sort((a,b)=>b.loseStreak.n-a.loseStreak.n).map(c=>({v:c.loseStreak.n,who:mlink(c.i),det:sDet(c.loseStreak)})),v=>v+' L')}
    ${recList('Win Streak vs One Opponent',vsRun.sort((a,b)=>b.s.n-a.s.n).map(x=>({v:x.s.n,who:`${mlink(x.c.i)} <span class="sub">over</span> ${mlink(x.o,M[x.o].short)}`,det:sDet(x.s)})),v=>v+' W')}
    ${recList('Consecutive 100-Point Games',s100.sort((a,b)=>b.s.n-a.s.n).map(x=>({v:x.s.n,who:mlink(x.c.i),det:sDet(x.s)})),v=>v+' gms')}
    ${recList('Consecutive Winning Seasons',CC.map(c=>({c,s:seasonRun(c,t=>t.wp>.5)})).sort((a,b)=>b.s.n-a.s.n).map(x=>({v:x.s.n,who:mlink(x.c.i),det:x.s.n?`${x.s.from}–${x.s.to}`:'–'})),v=>v+' yrs')}
    ${recList('Consecutive Losing Seasons',CC.map(c=>({c,s:seasonRun(c,t=>t.wp<.5)})).sort((a,b)=>b.s.n-a.s.n).map(x=>({v:x.s.n,who:mlink(x.c.i),det:x.s.n?`${x.s.from}–${x.s.to}`:'–'})),v=>v+' yrs')}
    ${recList('Longest Playoff Streak',CC.slice().sort((a,b)=>b.poStreak.n-a.poStreak.n).map(c=>({v:c.poStreak.n,who:mlink(c.i),det:c.poStreak.n?`${c.poStreak.from}–${c.poStreak.to}`:'–'})),v=>v+' yrs')}
    ${recList('Longest Playoff Drought',CC.slice().sort((a,b)=>b.poDrought.n-a.poDrought.n).map(c=>({v:c.poDrought.n,who:mlink(c.i),det:c.poDrought.n?`${c.poDrought.from}–${c.poDrought.to}`:'–'})),v=>v+' yrs')}
    ${recList('Longest Title Drought',CC.slice().sort((a,b)=>b.titleDrought.n-a.titleDrought.n).map(c=>({v:c.titleDrought.n,who:mlink(c.i),det:`${c.titleDrought.from}–${c.titleDrought.to}${c.titles.length?'':' · never won'}`})),v=>v+' yrs')}
    ${recList('Current Title Drought',active.slice().sort((a,b)=>b.curDrought-a.curDrought).map(c=>({v:c.curDrought,who:mlink(c.i),det:c.titles.length?`last title ${c.titles[c.titles.length-1]}`:`never won, since ${c.years[0]}`})),v=>v+' yrs','Active managers')}
    ${recList('Hottest Right Now',active.filter(c=>c.curStreak&&c.curStreak[0]==='W').sort((a,b)=>parseInt(b.curStreak.slice(1))-parseInt(a.curStreak.slice(1))).map(c=>({v:c.curStreak,who:mlink(c.i),det:esc(c.curTeam)})),v=>v,'Active win streaks')}
    ${recList('Coldest Right Now',active.filter(c=>c.curStreak&&c.curStreak[0]==='L').sort((a,b)=>parseInt(b.curStreak.slice(1))-parseInt(a.curStreak.slice(1))).map(c=>({v:c.curStreak,who:mlink(c.i),det:esc(c.curTeam)})),v=>v,'Active losing streaks')}
    </div>`;
  } else {
    const CC=C.filter(c=>okM(c.i)), q=CC.filter(c=>c.seasons>=3);
    CC.forEach(c=>{
      const cl=c.games.filter(x=>!x.g.multi&&x.r!=='T'&&Math.abs(x.ms-x.os)<10); c.clW=cl.filter(x=>x.r==='W').length; c.clL=cl.length-c.clW;
      const vw=c.games.filter(x=>!x.po&&SEASONS[x.y].complete&&x.ot.wp>.5&&x.r!=='T'); c.vwW=vw.filter(x=>x.r==='W').length; c.vwL=vw.length-c.vwW;
      c.lasts=(c.badges.toilet||[]).length; c.tens=c.teams.filter(t=>SEASONS[t.y].complete&&t.w>=10).length;
    });
    const MS=[['wins',c=>c.w,[100,150],'career wins',v=>v],['pts',c=>c.pf,[15000,20000,25000],'career points',f0],['po',c=>c.poApps.length,[5,10],'playoff trips',v=>v],['hi',c=>c.hiWeeks,[25],'weekly high scores',v=>v]];
    const msHtml=MS.map(([k,fn,levels,label,fm])=>{
      const top=levels[levels.length-1];
      return levels.map(L=>{const club=C.filter(c=>fn(c)>=L).sort((a,b)=>fn(b)-fn(a)); const next=C.filter(c=>c.active&&fn(c)<L).sort((a,b)=>fn(b)-fn(a)).slice(0,2);
        return `<div class="rec-row" style="grid-template-columns:1fr auto"><span><b>${fm(L)} ${label}</b><div class="sub">${club.length?club.map(c=>mlink(c.i,c.m.short)).join(', '):'Nobody yet'}</div>${next.length?`<div class="sub">On the verge: ${next.map(c=>`${esc(c.m.short)} (needs ${fm(L-fn(c))})`).join(', ')}</div>`:''}</span><span class="val">${club.length}</span></div>`;}).join('');}).join('');
    body=`<div class="grid3">
    ${recList('Most Wins',CC.slice().sort((a,b)=>b.w-a.w).map(c=>({v:c.w,who:mlink(c.i),det:`${rec(c.w,c.l,c.t)} in ${c.seasons} seasons`})),v=>v)}
    ${recList('Most Points',CC.slice().sort((a,b)=>b.pf-a.pf).map(c=>({v:c.pf,who:mlink(c.i),det:`${f1(c.ppg)} per game`})),f0)}
    ${recList('Best Win %',q.slice().sort((a,b)=>b.wp-a.wp).map(c=>({v:c.wp,who:mlink(c.i),det:rec(c.w,c.l,c.t)})),pct,'Minimum 3 seasons')}
    ${recList('Best Scoring vs League Avg',q.slice().sort((a,b)=>b.relPpg-a.relPpg).map(c=>({v:c.relPpg,who:mlink(c.i),det:`${f1(c.ppg)} per game`})),v=>sgn(v)+'%','Minimum 3 seasons')}
    ${recList('Clutch Record',CC.filter(c=>c.clW+c.clL>=15).sort((a,b)=>b.clW/(b.clW+b.clL)-a.clW/(a.clW+a.clL)).map(c=>({v:c.clW/(c.clW+c.clL),who:mlink(c.i),det:`${c.clW}-${c.clL} in games decided by under 10`})),pct,'Minimum 15 close games')}
    ${recList('Best vs Winning Teams',CC.filter(c=>c.vwW+c.vwL>=20).sort((a,b)=>b.vwW/(b.vwW+b.vwL)-a.vwW/(a.vwW+a.vwL)).map(c=>({v:c.vwW/(c.vwW+c.vwL),who:mlink(c.i),det:`${c.vwW}-${c.vwL} against teams that finished over .500`})),pct,'Regular season, minimum 20 games')}
    ${recList('Most 10-Win Seasons',CC.filter(c=>c.tens).sort((a,b)=>b.tens-a.tens).map(c=>({v:c.tens,who:mlink(c.i),det:c.teams.filter(t=>SEASONS[t.y].complete&&t.w>=10).map(t=>t.y).join(', ')})),v=>v)}
    ${recList('Most Last-Place Finishes',CC.filter(c=>c.lasts).sort((a,b)=>b.lasts-a.lasts).map(c=>({v:c.lasts,who:mlink(c.i),det:(c.badges.toilet||[]).join(', ')})),v=>v)}
    ${recList('Toughest Career Schedule',q.slice().sort((a,b)=>b.papg-a.papg).map(c=>({v:c.papg,who:mlink(c.i),det:`${f0(c.pa)} points allowed`})),f2,'Points allowed per game, minimum 3 seasons')}
    ${recList('Most Weekly High Scores',CC.slice().sort((a,b)=>b.hiWeeks-a.hiWeeks).map(c=>({v:c.hiWeeks,who:mlink(c.i),det:`in ${c.seasons} seasons`})),v=>v)}
    ${recList('Most 150-Point Games',CC.slice().sort((a,b)=>b.g150-a.g150).map(c=>({v:c.g150,who:mlink(c.i),det:`${c.gp} regular season games`})),v=>v)}
    ${recList('Luckiest Career',q.slice().sort((a,b)=>b.luck-a.luck).map(c=>({v:c.luck,who:mlink(c.i),det:`all-play ${pct(c.apPct)} vs actual ${pct(c.wp)}`})),v=>sgn(v)+' W')}
    ${recList('Unluckiest Career',q.slice().sort((a,b)=>a.luck-b.luck).map(c=>({v:c.luck,who:mlink(c.i),det:`all-play ${pct(c.apPct)} vs actual ${pct(c.wp)}`})),v=>sgn(v)+' W')}
    ${recList('Most Weekly Low Scores',CC.slice().sort((a,b)=>b.loWeeks-a.loWeeks).map(c=>({v:c.loWeeks,who:mlink(c.i),det:`in ${c.seasons} seasons`})),v=>v)}
    </div>
    <div class="card"><h3>Milestones</h3><p class="note" style="margin:-6px 0 8px">Every club, who's in it, and which active managers are closest to joining.</p><div class="rec-list" style="columns:2 360px;column-gap:28px;display:block">${msHtml}</div></div>`;
  }
  return `<div class="head"><div><h2>Record Book</h2><p class="lede">Two-week playoff totals from 2011, 2013 and 2014 are left out of single-game records so they don't bury everything else.</p></div></div>${nav}${filters}${body}`;
}

// ----- Franchise -----
function badgeChips(c,compact){
  const ks=BADGES.filter(b=>c.badges[b.k]);
  if(!ks.length) return '<span class="note">No badges yet.</span>';
  return `<div class="badgewrap"><div class="badges">${ks.map(b=>`<button type="button" class="badge ${b.type==='f'?'f':b.type==='t'?'t':''}" data-badge="${b.k}" data-m="${c.i}" aria-expanded="false"><i>${b.ab}</i>${b.name}${c.badges[b.k].length>1?` <b>×${c.badges[b.k].length}</b>`:''}</button>`).join('')}</div><div class="bdetail" hidden></div></div>`;
}
function vFranchise(i){
  const sel=`<div class="ctrl"><label for="fsel">Franchise</label><select id="fsel">${RANKED.map(c=>`<option value="${c.i}" ${c.i===+i?'selected':''}>${esc(c.name)}${c.active?'':' (former)'}</option>`).join('')}</select></div>`;
  if(i==null||!C[i]) i=(ACTIVE.find(c=>c.name==='Charles Arthur')||RANKED[0]).i;
  const c=C[+i];
  const tiles=[
    ['All-Time Record',rec(c.w,c.l,c.t),`${pct(c.wp)} · #${C.slice().sort((a,b)=>b.wp-a.wp).indexOf(c)+1} in league`],
    ['Championships',c.titles.length,c.titles.join(', ')||'Still hunting'],
    ['Title Games',c.finals.length,c.finals.join(', ')||'–'],
    ['Playoff Trips',c.poApps.length,`of ${c.eligible} · ${rec(c.pow,c.pol)} in games`],
    ['Points For',f0(c.pf),`${f1(c.ppg)} per game`],
    ['Avg Finish',f1(c.avgFin),`best: ${ord(c.best)}`],
    ['All-Play',pct(c.apPct),`luck ${sgn(c.luck)} wins`],
    ['Legacy Rank','#'+c.rank,`${f1(c.legacy)} pts`],
  ];
  const cols=[
    {k:'y',label:'Season',f:r=>`<a class="mgr" href="#season-${r.y}">${r.y}</a>`},
    {k:'n',label:'Team',f:r=>esc(r.n),asc:1},
    {k:'wp',label:'Record',r:1,f:r=>rec(r.w,r.l,r.t)},
    {k:'pf',label:'PF',r:1,f:r=>f2(r.pf)},
    {k:'pa',label:'PA',r:1,f:r=>f2(r.pa)},
    {k:'seed',label:'Seed',r:1,asc:1},
    {k:'f',label:'Finish',r:1,asc:1,f:r=>r.f?ord(r.f):'–'},
    {k:'res',label:'Result',nosort:1,f:r=>finishPill(r)},
  ];
  const opp=Object.entries(c.h2h).map(([o,h])=>({o:+o,...h,wp:(h.w+h.t/2)/h.n}));
  const most=opp.slice().sort((a,b)=>b.n-a.n)[0];
  const q=opp.filter(o=>o.n>=5);
  const fav=q.slice().sort((a,b)=>b.wp-a.wp)[0], nem=q.slice().sort((a,b)=>a.wp-b.wp)[0];
  const ocols=[
    {k:'o',label:'Opponent',pin:1,f:r=>mlink(r.o),sv:r=>M[r.o].name,asc:1},
    {k:'n',label:'GP',r:1},
    {k:'wp',label:'W-L',r:1,f:r=>rec(r.w,r.l,r.t)},
    {k:'pct',label:'Win %',r:1,f:r=>`<span class="${r.wp>.5?'pos':r.wp<.5?'neg':''}">${pct(r.wp)}</span>`,sv:r=>r.wp},
    {k:'po',label:'Playoffs',r:1,f:r=>r.pw+r.pl?rec(r.pw,r.pl):'–',sv:r=>r.pw+r.pl},
    {k:'avg',label:'Avg Score',r:1,f:r=>`${f1(r.pf/r.n)}–${f1(r.pa/r.n)}`,sv:r=>r.pf/r.n-r.pa/r.n},
    {k:'vs',label:'',nosort:1,f:r=>`<a class="mgr" href="#versus-${c.i}-${r.o}">Versus</a>`},
  ];
  const doneT=c.teams.filter(t=>SEASONS[t.y].complete||t.y===CUR);
  const chart=lineChart({xs:c.years,series:[{name:'Finish',color:'var(--accent)',pts:c.teams.map(t=>[t.y,SEASONS[t.y].complete?t.f:null,t.n])},{name:'Regular season seed',color:'var(--muted)',dash:1,w:2,pts:c.teams.map(t=>[t.y,t.seed,t.n])}],yMin:1,yMax:12,invert:1,yTicks:[1,3,6,9,12],yFmt:v=>ord(Math.round(v)),h:230});

// ----- H2H -----
let H2H_OPTS={active:true,po:true};
function rec2(c,o,po){const h=c.h2h[o]; if(!h) return null; if(po) return h; const r=h.list.filter(x=>!x.po); return {w:r.filter(x=>x.r==='W').length,l:r.filter(x=>x.r==='L').length,t:r.filter(x=>x.r==='T').length,n:r.length};}
function vH2H(){
  const list=(H2H_OPTS.active?ACTIVE:RANKED);
  const cell=(a,b)=>{ if(a===b) return `<td style="background:var(--soft)"></td>`; const h=rec2(a,b.i,H2H_OPTS.po); if(!h||!h.n) return `<td class="sub">–</td>`;
    const p=(h.w+h.t/2)/h.n; const bg=p>.5?`color-mix(in srgb, var(--good) ${Math.round((p-.5)*120+10)}%, var(--surface))`:p<.5?`color-mix(in srgb, var(--bad) ${Math.round((.5-p)*120+10)}%, var(--surface))`:'var(--soft)';
    return `<td class="cell num" style="background:${bg}" data-vs="${a.i}-${b.i}" title="${esc(a.name)} vs ${esc(b.name)}: ${rec(h.w,h.l,h.t)}">${rec(h.w,h.l,h.t)}</td>`;};
  return `<div class="head"><div><h2>Head-to-Head</h2></div></div>
  ${vVersusBody(...defaultPair(),true)}
  <div class="card"><div class="head" style="margin-bottom:12px"><div><h3>Head-to-Head Grid</h3><p class="note" style="margin:4px 0 0">Read across: each row is that manager's record against the column. Green means they own the matchup. Click any cell to load it into Versus above.</p></div><div class="ctrl"><label class="toggle"><input type="checkbox" id="h-act" ${H2H_OPTS.active?'checked':''}> Active managers only</label><label class="toggle"><input type="checkbox" id="h-po" ${H2H_OPTS.po?'checked':''}> Include playoffs</label></div></div><div class="tblwrap"><table class="h2h"><thead><tr><th class="rowh"></th>${list.map(b=>`<th class="colh">${esc(b.m.short)}</th>`).join('')}<th class="colh">Total</th></tr></thead><tbody>${list.map(a=>{let w=0,l=0,t=0; list.forEach(b=>{if(a!==b){const h=rec2(a,b.i,H2H_OPTS.po); if(h){w+=h.w;l+=h.l;t+=h.t;}}}); return `<tr><th class="rowh">${mlink(a.i,a.m.short)}</th>${list.map(b=>cell(a,b)).join('')}<td class="num"><b>${rec(w,l,t)}</b></td></tr>`;}).join('')}</tbody></table></div></div>`;
}
function defaultPair(){
  // most-played active rivalry
  let best=null; ACTIVE.forEach(a=>ACTIVE.forEach(b=>{if(a.i<b.i){const h=a.h2h[b.i]; if(h&&(!best||h.n>best[2]))best=[a.i,b.i,h.n];}}));
  return best?[best[0],best[1]]:[RANKED[0].i,RANKED[1].i];
}
function rankOf(key,c,asc){const s=C.slice().filter(x=>!isNaN(key(x))).sort((a,b)=>asc?key(a)-key(b):key(b)-key(a)); return s.indexOf(c)+1;}
function vVersusBody(ai,bi,embedded){
  const a=C[ai], b=C[bi];
  const opts=sel=>RANKED.map(c=>`<option value="${c.i}" ${c.i===sel?'selected':''}>${esc(c.name)}</option>`).join('');
  const h=a.h2h[bi]||{w:0,l:0,t:0,n:0,list:[],pw:0,pl:0,pf:0,pa:0};
  const reg=h.list.filter(x=>!x.po), po=h.list.filter(x=>x.po);
  const rw=reg.filter(x=>x.r==='W').length, rl=reg.filter(x=>x.r==='L').length;
  let streak='–'; if(h.list.length){const last=h.list[h.list.length-1]; let n=0; for(let k=h.list.length-1;k>=0&&h.list[k].r===last.r;k--)n++; streak=`${last.r==='W'?a.m.short:last.r==='L'?b.m.short:'Tied'} ${last.r==='T'?'':n+' straight'}`;}
  const sg=h.list.filter(x=>!x.g.multi);
  const bigA=sg.filter(x=>x.r==='W').sort((p,q)=>(q.ms-q.os)-(p.ms-p.os))[0], bigB=sg.filter(x=>x.r==='L').sort((p,q)=>(p.ms-p.os)-(q.ms-q.os))[0];
  const close=sg.filter(x=>x.r!=='T').sort((p,q)=>Math.abs(p.ms-p.os)-Math.abs(q.ms-q.os))[0];
  const stats=[
    ['Titles',c=>c.titles.length,0],['Title games',c=>c.finals.length,0],['Playoff trips',c=>c.poApps.length,0],

  const cmp=stats.map(([n,k,asc,fm])=>{const va=k(a),vb=k(b); const fmt=fm||(v=>v); const aw=asc?va<vb:va>vb, bw=asc?vb<va:vb>va;

  const lucky = a.luck>b.luck?a:b;
  const hist=h.list.slice().reverse().map(x=>({y:x.y,wk:x.wk,po:x.po,ms:x.ms,os:x.os,r:x.r,mt:x.mt,ot:x.ot}));
  const hcols=[

    {k:'tm',label:'Teams',nosort:1,f:r=>`<span class="sub">${esc(r.mt.n)} vs ${esc(r.ot.n)}</span>`},

  return `<div class="card" id="versus">

    <div class="vs-head"><div><div class="nm">${mlink(ai)}</div><div class="sub">${esc(a.curTeam)}</div></div><div><div class="big num">${h.w}<span class="sub" style="font-size:28px"> – </span>${h.l}</div>${h.t?`<div class="sub">${h.t} tie${h.t>1?'s':''}</div>`:''}</div><div><div class="nm">${mlink(bi)}</div><div class="sub">${esc(b.curTeam)}</div></div></div>
    <div class="tiles" style="margin-top:16px">
      <div class="tile"><div class="k">Regular season</div><div class="v num">${rw}-${rl}</div></div>
      <div class="tile"><div class="k">Playoffs</div><div class="v num">${h.pw}-${h.pl}</div></div>
      <div class="tile"><div class="k">Avg score</div><div class="v num" style="font-size:22px;white-space:nowrap">${h.n?f1(h.pf/h.n)+' – '+f1(h.pa/h.n):'–'}</div></div>
      <div class="tile"><div class="k">Current streak</div><div class="v" style="font-size:20px">${esc(streak)}</div></div>
      ${bigA?`<div class="tile"><div class="k">${esc(a.m.short)} biggest win</div><div class="v num">${sgn(bigA.ms-bigA.os)}</div><div class="sub">${bigA.y} Wk ${bigA.wk}</div></div>`:''}
      ${bigB?`<div class="tile"><div class="k">${esc(b.m.short)} biggest win</div><div class="v num">${sgn(bigB.os-bigB.ms)}</div><div class="sub">${bigB.y} Wk ${bigB.wk}</div></div>`:''}
      ${close?`<div class="tile"><div class="k">Closest game</div><div class="v num">${f2(Math.abs(close.ms-close.os))}</div><div class="sub">${close.y} Wk ${close.wk}</div></div>`:''}
    </div>
    <h3 style="margin:20px 0 8px">Tale of the Tape</h3>

    <div class="tblwrap"><table><tbody>${cmp}</tbody></table></div>

function vVersus(ai,bi){ return `<div class="head"><div><h2>Versus</h2><p class="lede">Pick any two managers. Who has beaten who, who has scored more, and who has gotten luckier.</p></div><a class="chip" href="#h2h">Back to the grid</a></div>${vVersusBody(+ai,+bi)}`; }

  const longest=p=>{let best={n:0},cur=null; p.h.list.forEach(x=>{if(x.r==='T'){cur=null;return;} if(cur&&cur.r===x.r){cur.n++; cur.to=x.y;} else cur={r:x.r,n:1,from:x.y,to:x.y}; if(cur.n>best.n)best={...cur};}); return {...best,who:best.r==='W'?p.a:p.b};};

// ----- This season -----
let NOWM=null;
function erfc_(x){const z=Math.abs(x),t=1/(1+.5*z);const r=t*Math.exp(-z*z-1.26551223+t*(1.00002368+t*(.37409196+t*(.09678418+t*(-.18628806+t*(.27886807+t*(-1.13520398+t*(1.48851587+t*(-.82215223+t*.17087277)))))))));return x>=0?r:2-r;}
const Phi=x=>.5*erfc_(-x/Math.SQRT2);
function nowModel(){

  list.forEach(t=>sc[t.id].sort((a,b)=>a.wk-b.wk));
  const allS=reg.flatMap(g=>[g.hs,g.as]), lgM=avg(allS), lgSd=sd(allS);
  const model={}; list.forEach(t=>{const a=sc[t.id].map(x=>x.s), n=a.length, m=n?avg(a):lgM, s=n>1?sd(a):lgSd;
    model[t.id]={mu:(n*m+3*lgM)/(n+3), sig:Math.sqrt((n*s*s+4*lgSd*lgSd)/(n+4))};});

  const winP=(a,b)=>Phi((model[a.id].mu-model[b.id].mu)/Math.sqrt(model[a.id].sig**2+model[b.id].sig**2));

  const N=10000, res={}; list.forEach(t=>res[t.id]={po:0,bye:0,title:0,final:0,w:0,pf:0,seed:0});

    up.forEach(g=>{const a=draw(g.ht.id),b=draw(g.at.id); PF[g.ht.id]+=a; PF[g.at.id]+=b; if(a>b)W[g.ht.id]++; else W[g.at.id]++;});

    order.forEach((id,i)=>{const r=res[id]; r.w+=W[id]; r.pf+=PF[id]; r.seed+=i+1; if(i<po)r.po++; if(i<2)r.bye++;});
    if(po===6){const o=order, g=(a,b)=>draw(a)>draw(b)?a:b; const w45=g(o[3],o[4]), w36=g(o[2],o[5]); const f1=g(o[0],w45), f2=g(o[1],w36); res[f1].final++; res[f2].final++; res[g(f1,f2)].title++;}
  }
  // clinch / elimination (ties broken by points, so ties count as not yet decided)
  const cur=list.slice().sort((a,b)=>(b.w-a.w)||(b.pf-a.pf));
  const maxW=t=>t.w+t.t/2+remaining[t.id].length;
  const status={};

    const canPass=others.filter(o=>maxW(o)>=w).length, surelyAhead=others.filter(o=>o.w+o.t/2>maxW(t)).length;

  // power rankings at a given week
  const powerAt=wk=>{const rows=list.map(t=>{const gs=sc[t.id].filter(x=>x.wk<=wk); if(!gs.length) return {t,score:0};
      const w=gs.filter(x=>x.s>x.o).length+gs.filter(x=>x.s===x.o).length/2, wp=w/gs.length;

      const ap=apn?apw/apn:.5; const l3=gs.slice(-3), lgW=avg(reg.filter(g=>g.wk<=wk&&g.wk>wk-3).flatMap(g=>[g.hs,g.as]));

    reg.filter(g=>g.wk<=w).forEach(g=>{PF[g.ht.id]+=g.hs; PF[g.at.id]+=g.as; if(g.hs>g.as)W[g.ht.id]++; else if(g.as>g.hs)W[g.at.id]++; else {W[g.ht.id]+=.5;W[g.at.id]+=.5;}});

function vNow(){

  const NM=nowModel(), {list,reg,po,G,lastWk,sc,model,up,remaining,winP,res,N,status,sos,pNow,rankByWeek}=NM;
  const tm=t=>`<b>${esc(t.n)}</b><div class="sub">${mlink(t.m)}</div>`;
  const form=t=>sc[t.id].slice(-3).map(x=>x.s>x.o?'W':x.s<x.o?'L':'T').join('');

  // ---- this week's matchups
  const nextWk=up.length?up[0].wk:null, nextGames=up.filter(g=>g.wk===nextWk);
  const muCard=g=>{const a=g.ht,b=g.at, pa=winP(a,b), h=C[a.m].h2h[b.m]; const fav=pa>=.5?a:b, fp=Math.max(pa,1-pa);
    let hist='First meeting'; if(h&&h.n){const lead=h.w>h.l?`${M[a.m].short} leads ${h.w}-${h.l}${h.t?'-'+h.t:''}`:h.l>h.w?`${M[b.m].short} leads ${h.l}-${h.w}${h.t?'-'+h.t:''}`:`Tied ${h.w}-${h.l}`; const L=h.list[h.list.length-1]; const lw=L.r==='W'?a.m:b.m;
      hist=`${lead} all-time · last met ${L.y} Wk ${L.wk}, ${esc(M[lw].short)} won ${f2(Math.max(L.ms,L.os))}-${f2(Math.min(L.ms,L.os))}`;}

  // ---- playoff odds table

  // ---- highs and lows

  const curSc=allScores.filter(x=>x.g.y===CUR);
  const blow=reg.filter(g=>!g.tie).sort((a,b)=>b.margin-a.margin)[0], close=reg.filter(g=>!g.tie).sort((a,b)=>a.margin-b.margin)[0];
  const tiles=[

    {k:'n',label:'Team',pin:1,f:r=>tm(r),sv:r=>r.n,asc:1},
    {k:'papg',label:'Opp. PPG faced',r:1,f:r=>f1(r.papg)},

  // ---- streaks and luck

// ---------- router ----------
function route(){
  const h=(location.hash||'#home').slice(1);
  let g='history', html='';
  if(h==='home'||h===''){g='home'; html=vHome();}
  else if(h==='now'){g='now'; html=vNow();}
  else if(h==='standings') html=vStandings();
  else if(h==='champions') html=vChampions();
  else if(h==='ratings') html=vRatings();
  else if(h==='trends') html=vTrends();
  else if(h.startsWith('season')) html=vSeason(h.split('-')[1]||CUR);
  else if(h.startsWith('records')){g='records'; html=vRecords(h.split('-')[1]);}
  else if(h.startsWith('franchise')){g='franchise'; const p=h.split('-')[1]; html=vFranchise(p==null?null:+p);}
  else if(h==='h2h'){g='h2h'; html=vH2H();}
  else if(h.startsWith('versus')){g='h2h'; const p=h.split('-'); html=vVersus(p[1]||defaultPair()[0],p[2]||defaultPair()[1]);}
  else if(h==='achievements'){g='achievements'; html=vAch();}
  else html=vStandings();
  app.innerHTML=html;
  document.querySelectorAll('#tabs a').forEach(a=>a.classList.toggle('on',a.dataset.g===g));
  wire();
}
function wire(){
  const fs=document.getElementById('fsel'); if(fs) fs.onchange=()=>{location.hash='franchise-'+fs.value;};
  const va=document.getElementById('vs-a'), vb=document.getElementById('vs-b');
  if(va&&vb){ const go=()=>{ if(location.hash.startsWith('#versus')) location.hash=`versus-${va.value}-${vb.value}`; else { document.getElementById('versus').outerHTML=vVersusBody(+va.value,+vb.value,true); wire(); } }; va.onchange=go; vb.onchange=go; }
  [['rf-type','type'],['rf-era','era'],['rf-n','n']].forEach(([id,k])=>{const el=document.getElementById(id); if(el) el.onchange=()=>{REC_F[k]=k==='n'?+el.value:el.value; const y=window.scrollY; route(); window.scrollTo(0,y);};});
  const ra=document.getElementById('rf-active'); if(ra) ra.onchange=()=>{REC_F.active=ra.checked; const y=window.scrollY; route(); window.scrollTo(0,y);};
  const sm=document.getElementById('st-more'); if(sm) sm.onchange=()=>{STAND_MORE=sm.checked; route();};
  const ha=document.getElementById('h-act'), hp=document.getElementById('h-po');
  if(ha) ha.onchange=()=>{H2H_OPTS.active=ha.checked; route();};
  if(hp) hp.onchange=()=>{H2H_OPTS.po=hp.checked; route();};
  document.querySelectorAll('td[data-vs]').forEach(td=>td.onclick=()=>{const [x,y]=td.dataset.vs.split('-'); const v=document.getElementById('versus'); if(v){v.outerHTML=vVersusBody(+x,+y,true); wire(); document.getElementById('versus').scrollIntoView({behavior:'smooth'});} else location.hash='versus-'+td.dataset.vs;});
}
document.getElementById('tab-now').textContent=CUR+' Season';
window.addEventListener('hashchange',()=>{route(); window.scrollTo(0,0);});
route();
};
fetch("data/league.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json();}).then(d=>window.BOOT(d)).catch(e=>{document.getElementById("app").innerHTML=`<div class="card"><h3>Could not load league data</h3><p class="note">data/league.json failed to load (${e.message}). If you opened this file directly from your computer, serve the folder instead, for example: python3 -m http.server</p></div>`;});
</script>
