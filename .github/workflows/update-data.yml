name: Refresh league data from ESPN

on:
  schedule:
    # Tuesdays and Wednesdays at 11:17 UTC (early morning ET), after Monday Night Football is final
    - cron: "17 11 * * 2,3"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull every season from ESPN
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
        run: python3 scripts/update_data.py
      - name: Commit if anything changed
        run: |
          if git diff --quiet data/league.json; then
            echo "No new results."
          else
            git config user.name "bvffb-bot"
            git config user.email "bvffb-bot@users.noreply.github.com"
            git add data/league.json
            git commit -m "Refresh league data $(date -u +%Y-%m-%d)"
            git push
          fi
